name: CI

on:
  workflow_dispatch:
    inputs:
      optimize:
        description: 'Run R8 shrinking (slower build, smaller faster app; use for measuring)'
        type: boolean
        default: false
  push:
    branches:
      - iceraven

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-automation:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK with pieces Gradle skips
        run: ./automation/iceraven/install-sdk.sh

      - name: Inspect memory
        run: free -h

      - name: Create version name
        run: echo "VERSION_NAME=$(git describe --tags HEAD)" >> $GITHUB_ENV

      - name: Patch on the fly
        run: |
          ./automation/iceraven/patch_android_components.sh
          ./automation/iceraven/setup_venv.sh

      - name: Relpace strings
        run: |
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build forkRelease variant of app
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: |
          FLAGS="--build-cache --parallel"
          # shortcut: skipping R8 gives a bigger, slower app; set the optimize input for real measurements
          if [ "${{ inputs.optimize }}" != "true" ]; then FLAGS="$FLAGS -PdisableOptimization"; fi
          /usr/bin/time -v ./gradlew app:assembleForkRelease -PversionName=${{ env.VERSION_NAME }} $FLAGS --stacktrace --no-daemon

      - name: Debug
        run: |
          /usr/bin/ls -alh gradle/build/app/outputs/apk/forkRelease/

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-apks
          path: gradle/build/app/outputs/apk/forkRelease/*.apk
